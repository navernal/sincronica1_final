<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Mi Perfil</ion-title>
    </ion-toolbar>
    <ion-toolbar color="light">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/home" text="Atrás" style="color: #e91e63; font-family: 'Poppins', sans-serif;"></ion-back-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

    <!-- Tarjeta de información del usuario -->
    <ion-card *ngIf="usuario">
        <ion-card-header>
            <ion-card-title>{{ usuario.nombre }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
            <p><strong>Correo:</strong> {{ usuario.email }}</p>
            <p><strong>RUT:</strong> {{ usuario.rut }}</p>
        </ion-card-content>
    </ion-card>

    <!-- Lista de citas -->
    <ion-card *ngIf="citas.length > 0">
        <ion-card-header>
            <ion-card-title>Mis Citas</ion-card-title>
        </ion-card-header>
        <ion-card-content>
            <ion-list>
                <ion-item *ngFor="let cita of citas">
                    <ion-label>
                        <h3>{{ cita.servicio }} con {{ cita.manicurista }}</h3>
                        <p>{{ cita.fecha }} a las {{ cita.hora }}</p>
                    </ion-label>
                </ion-item>
            </ion-list>
        </ion-card-content>
    </ion-card>

    <!-- Si no hay citas -->
    <div *ngIf="citas.length === 0 && usuario">
        <ion-text color="medium">Aún no tienes citas agendadas.</ion-text>
    </div>

</ion-content>
